name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # one job per engine, side by side: Chromium, and WebKit (iPad Safari's engine)
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # every narratable line has its clip in src/voice (scripts/check-voice.ts)
      - run: npm run voice:check
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.browser }}
      # traces of failed tests: download the artifact, then `npx playwright show-trace <trace.zip>`
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 14
