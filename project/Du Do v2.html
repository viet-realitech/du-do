<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#16130f">
<title>Dư Đồ v2 — Bản đồ Việt Nam 1858 – nay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500&family=IBM+Plex+Mono:wght@400;500&family=Big+Shoulders+Display:wght@600;800;900&family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<script src="data.js"></script>
<script src="data2.js"></script>
<script src="vn-provinces.js"></script>
<script src="image-slot.js"></script>
<style>
:root{--paper:#efe5cf;--paper2:#e5d6b6;--paper3:#d9c7a1;--ink:#2e2216;--ink2:#5f4c36;--ink3:#8a7558;--rule:rgba(46,34,22,.16);--red:#a8322b;--gold:#c99a2e;--ok:#4f7a46;
--serif:'EB Garamond',Georgia,serif;--disp:'Playfair Display',Georgia,serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#1e1a15;color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:var(--red)}a:hover{color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.stage{display:flex;align-items:center;justify-content:center;gap:40px;height:100%;padding:20px}
.pw{transform-origin:center;flex:none}
.phone{width:414px;height:868px;padding:12px;border-radius:60px;background:#0f0d0a;box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 0 0 2px #3a3128}
#app{position:relative;width:390px;height:844px;border-radius:48px;overflow:hidden;background:var(--paper);isolation:isolate;--acc:var(--ink);--rip:#4e5f5a;color:var(--ink)}
#app[data-theme=night]{--paper:#16130f;--paper2:#221d17;--paper3:#3a3127;--ink:#efe0bf;--ink2:#c2b08d;--ink3:#8d7c5e;--rule:rgba(239,224,191,.15);--red:#e8603f;--acc:#e6a73c;--rip:#d9a441;--ok:#8fbf74;--disp:'Big Shoulders Display',sans-serif}
#app[data-theme=night].grain::before{mix-blend-mode:screen;opacity:.12}
#app[data-theme=night] .yr{font-size:84px;font-weight:900;letter-spacing:0}
#app[data-theme=night] .card{box-shadow:none;border-color:rgba(230,167,60,.3)}
#app[data-theme=night] .thumb::after{box-shadow:0 0 0 5px rgba(232,96,63,.2),0 0 18px rgba(232,96,63,.6)}
#app[data-theme=poster]{--paper:#f2e7cd;--paper2:#e8d8b0;--paper3:#d6c08c;--ink:#16130f;--ink2:#3e362b;--ink3:#6e6250;--rule:rgba(22,19,15,.28);--red:#c81f2a;--acc:#c81f2a;--disp:'Be Vietnam Pro',sans-serif;--serif:'Be Vietnam Pro',sans-serif}
#app[data-theme=poster] .yr{font-weight:900;font-size:72px;letter-spacing:-.04em}
#app[data-theme=poster] h1,#app[data-theme=poster] h2{font-weight:900;letter-spacing:-.025em;text-transform:uppercase}
#app[data-theme=poster] .hd .era b{font-style:normal;font-weight:800;text-transform:uppercase;font-size:16px}
#app[data-theme=poster] p{font-size:15.5px}
#app[data-theme=poster] .card,#app[data-theme=poster] .opt,#app[data-theme=poster] .pv{border:2px solid var(--ink);border-radius:4px;box-shadow:4px 4px 0 var(--ink)}
#app[data-theme=poster] .btn,#app[data-theme=poster] .rb,#app[data-theme=poster] .back,#app[data-theme=poster] .chip,#app[data-theme=poster] .seg,#app[data-theme=poster] .seg button{border-radius:4px}
#app[data-theme=poster] .card.cta{background:var(--red);border-color:var(--ink)}
#app[data-theme=poster] .tabs{border-top:2px solid var(--ink)}
#app.grain::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.55;mix-blend-mode:multiply;
background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .35  0 0 0 0 .2  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),radial-gradient(120% 80% at 50% 40%,transparent 55%,rgba(110,80,40,.22))}
.sb{position:absolute;top:0;left:0;right:0;height:47px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;font:600 15px/1 -apple-system,system-ui,sans-serif;z-index:60;pointer-events:none}
.sb .isl{position:absolute;left:50%;top:11px;width:122px;height:35px;margin-left:-61px;border-radius:20px;background:#0c0a08}
.sb .r{display:flex;gap:6px;align-items:center}.sb .bat{width:25px;height:12px;border:1.5px solid currentColor;border-radius:4px;padding:1.5px;opacity:.9}.sb .bat i{display:block;height:100%;width:70%;background:currentColor;border-radius:1.5px}
.mono{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
#main{position:absolute;inset:0;display:flex;flex-direction:column;z-index:1}
.hd{padding:52px 20px 0;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.yr{color:var(--acc);font:800 66px/0.86 var(--disp);letter-spacing:-.02em;font-variant-numeric:lining-nums tabular-nums}
.hd .era{display:flex;flex-direction:column;align-items:flex-end;gap:6px;text-align:right;padding-bottom:4px;max-width:180px}
.hd .era b{font:500 italic 19px/1.05 var(--disp)}
.lbl{font-size:14.5px;line-height:20px;height:28px;color:var(--ink2);padding:8px 20px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-sizing:content-box}
.vals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;padding:12px 20px 0;height:24px;box-sizing:content-box}
.eraR{display:flex;align-items:center;gap:6px;font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.eraR .av{width:20px;height:20px;font-size:8px}
.comp{display:flex;align-items:center;gap:7px;padding:3px 10px 3px 3px;border:1px solid var(--rule);border-radius:20px;font-size:13px;max-width:140px;flex:none;text-align:left;line-height:1.05}
.comp small{display:block;font:500 9px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.av img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.av.lock img{filter:blur(5px) grayscale(1);opacity:.55;transform:scale(1.15)}.av.lock{color:transparent}
.av{overflow:hidden;display:inline-grid;place-items:center;border-radius:50%;background:var(--paper3);color:var(--ink);font:700 12px var(--disp);flex:none;width:28px;height:28px;border:1px solid var(--rule);letter-spacing:.02em}
.mt{font-size:11.5px;color:var(--ink3);display:flex;flex-direction:column;gap:5px;white-space:nowrap}
.mt>span{display:flex;justify-content:space-between}.mt>span b{font-weight:500;color:var(--ink2)}
.mt i{height:2px;background:var(--rule);overflow:hidden;display:block}.mt i b{display:block;height:100%;background:var(--acc);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.fmenu{position:absolute;right:56px;top:10px;z-index:4;background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:5px;display:flex;flex-direction:column;gap:2px;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:fade .15s}
.fmenu button{text-align:left;padding:7px 12px;border-radius:8px;font-size:14.5px;display:flex;justify-content:space-between;gap:18px}
.fmenu button span{color:var(--ink3);font-size:13px}.fmenu button.on{background:var(--ink);color:var(--paper)}.fmenu button.on span{color:var(--paper3)}
.mapwrap{position:relative;flex:1;min-height:0;margin:12px 14px 0;border:1px solid var(--ink3);border-radius:16px;overflow:hidden}
.mtag{position:absolute;left:10px;top:10px;font:500 9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);background:var(--paper);opacity:.92;padding:5px 8px;border-radius:6px;pointer-events:none;z-index:2}
.tour{position:absolute;left:10px;right:10px;bottom:10px;z-index:3;display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:8px 8px 8px 12px;animation:up .25s}
.tour .chip{height:30px;font-size:13.5px}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;overflow:hidden;cursor:grab}
.zoomc{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zoomc button{width:34px;height:34px;border-radius:50%;background:var(--paper);border:1px solid var(--rule);font-size:17px;display:grid;place-items:center;position:relative}
.zoomc button.act::after{content:"";position:absolute;right:1px;top:1px;width:8px;height:8px;border-radius:50%;background:var(--acc)}
#pop{position:absolute;left:12px;right:56px;bottom:8px;z-index:3;background:var(--paper);border:1px solid var(--ink);border-radius:12px;padding:9px 12px;animation:up .2s;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#pop b{font:700 17px/1.1 var(--disp)}
.legend{display:flex;gap:16px;padding:10px 20px 0;height:20px;box-sizing:content-box;overflow-x:auto;white-space:nowrap;scrollbar-width:none}.legend::-webkit-scrollbar{display:none}
.legend span{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);flex:none}
.flag{display:inline-block;width:20px;height:13px;border:1px solid rgba(46,34,22,.5);position:relative;flex:none;overflow:hidden}
.flag b{position:absolute;inset:0;display:grid;place-items:center;color:#f2c933;font-size:9px;line-height:1}
.card{margin:10px 14px 0;background:var(--paper2);border:1px solid var(--rule);border-radius:14px;padding:0 12px 0 16px;display:flex;gap:12px;align-items:center;height:88px;flex:none}
.card .c{flex:1;min-width:0;cursor:pointer}
.card .c .t{font:700 17px/1.2 var(--disp);margin:4px 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .c .s{font-size:13.5px;line-height:1.3;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.diary{border-style:dashed;border-color:var(--acc)}
.card .nav{display:flex;flex-direction:column;gap:6px}.card .nav .rb{width:32px;height:32px}
.rb{width:34px;height:34px;border-radius:50%;border:1px solid var(--rule);display:grid;place-items:center;font-size:16px;background:var(--paper)}
.rb:active{background:var(--paper3)}
.card.cta{background:var(--ink);color:var(--paper)}.card.cta .s{color:var(--paper3)}
.scrub{position:relative;height:64px;margin:6px 0 0;padding:0 20px 0 14px;display:flex;align-items:center;gap:12px;user-select:none;flex:none}
.pbtn{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:13px;flex:none;letter-spacing:-1px}
.tl{position:relative;flex:1;height:52px;touch-action:none;cursor:grab}
.trk{position:absolute;inset:0}
.sg{position:absolute;top:22px;height:4px;border-radius:2px;background:var(--rule);transition:background .3s}
.sg.done{background:var(--ink3)}.sg.cur{background:var(--acc)}
.tk{position:absolute;top:12px;width:1px;height:5px;background:var(--ink3);opacity:.55}
.tk.d{background:var(--acc);opacity:1;height:6px;width:2px;top:11px}
.cp{position:absolute;top:20px;width:8px;height:8px;margin-left:-4px;transform:rotate(45deg);background:var(--paper);border:1.5px solid var(--ink3)}
.cp.done{display:none}
.cp.pend{background:var(--red);border-color:var(--red);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.35}}
.thumb{position:absolute;top:8px;width:2px;height:28px;margin-left:-1px;background:var(--red);border-radius:1px;pointer-events:none}
.thumb::after{content:"";position:absolute;left:50%;top:14px;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px rgba(232,96,63,.18)}
.dec{position:absolute;top:36px;font:500 9.5px var(--mono);letter-spacing:.06em;transform:translateX(-50%);color:var(--ink3)}
.dec.l{transform:none}.dec.r{transform:translateX(-100%)}
.tabs{height:82px;display:flex;justify-content:space-around;padding:10px 12px 0;border-top:1px solid var(--rule);background:var(--paper);position:relative;z-index:30}
.tab{display:flex;flex-direction:column;align-items:center;gap:5px;width:76px;color:var(--ink3);font-size:13px}
.tab i{width:22px;height:22px;display:grid;place-items:center;font-style:normal}
.tab.on{color:var(--ink)}
.tab .ic1{width:17px;height:17px;border:1.6px solid currentColor;transform:rotate(45deg)}
.tab .ic2{width:16px;height:20px;border:1.6px solid currentColor;border-radius:2px;box-shadow:3px -3px 0 -1.6px var(--paper),3px -3px 0 0 currentColor}
.tab .ic3{width:18px;height:18px;border:1.6px solid currentColor;border-radius:50%}
.tab .ic4{width:20px;height:14px;border:1.6px solid currentColor;border-radius:10px 10px 3px 3px;margin-top:6px;position:relative}
.tab .ic4::before{content:"";position:absolute;width:9px;height:9px;border:1.6px solid currentColor;border-radius:50%;left:50%;top:-12px;margin-left:-6px}
.home{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink);z-index:80;pointer-events:none}
.pane{position:absolute;left:0;right:0;top:0;bottom:82px;background:var(--paper);z-index:20;overflow-y:auto;padding:54px 20px 30px;animation:fade .25s}
.ov{position:absolute;inset:0;z-index:40;background:var(--paper);overflow-y:auto;animation:up .32s cubic-bezier(.2,.8,.2,1)}
.scrim{position:absolute;inset:0;z-index:40;background:rgba(10,8,5,.55);animation:fade .2s;display:flex;align-items:flex-end}
.sheet{width:100%;max-height:92%;overflow-y:auto;background:var(--paper);border-radius:26px 26px 0 0;padding:12px 18px 34px;animation:up .34s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--paper3);margin:0 auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
h1{font:800 34px/1.02 var(--disp);letter-spacing:-.01em;text-wrap:balance}
h2{font:700 26px/1.08 var(--disp);text-wrap:balance}
h3{font:700 19px/1.15 var(--disp)}
p{font-size:17px;line-height:1.4;text-wrap:pretty}
.muted{color:var(--ink2)}
.rule{height:1px;background:var(--rule);margin:16px 0}
.dbl{border-top:3px double var(--ink);margin:14px 0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:26px;background:var(--ink);color:var(--paper);font:600 17px var(--serif);width:100%;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.lnk{display:block;margin:12px auto 0;font-size:15px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;border:1px solid var(--rule);font-size:14px;white-space:nowrap;flex:none}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.fx{display:inline-flex;gap:4px;align-items:center;font:500 11px var(--mono);letter-spacing:.04em;padding:2px 7px;border-radius:10px;background:var(--paper3);color:var(--ink)}
.back{width:40px;height:40px;border-radius:50%;border:1px solid var(--rule);display:grid;place-items:center;font-size:20px;background:var(--paper)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--rule);border-radius:16px;padding:13px 14px 12px;background:var(--paper);transition:.15s;position:relative}
.opt+.opt{margin-top:10px}
.opt .tt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.opt h3{font-size:21px}
.opt .who{font-size:14px;font-style:italic;color:var(--ink2);margin:2px 0 6px}
.opt p{font-size:16px;line-height:1.3}
.opt .fxs{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.opt.sel{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.opt.sel .who,.opt.sel .mono{color:var(--paper3)}
.opt.sel .fx{background:var(--paper);color:var(--ink)}
.qa{display:block;width:100%;text-align:left;border:1px solid var(--rule);border-radius:14px;padding:13px 14px;font-size:18px;background:var(--paper2)}
.qa+.qa{margin-top:8px}
.qa.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.qa.no{background:var(--red);color:#fff;border-color:var(--red)}
.stamp{display:inline-block;border:2px solid var(--red);color:var(--red);padding:4px 10px;transform:rotate(-4deg);font:600 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;border-radius:3px}
.seg{display:flex;border:1px solid var(--ink);border-radius:22px;padding:3px;gap:2px}
.seg button{flex:1;height:34px;border-radius:18px;font-size:15px}
.seg button.on{background:var(--ink);color:var(--paper)}
.pv{border:1px solid var(--rule);border-radius:14px;padding:12px 14px;background:var(--paper2)}
.pv+.pv{margin-top:10px}
.pv.mine{background:var(--paper);border:1.5px solid var(--acc)}
.pv q{display:block;font-size:17px;line-height:1.35;margin-top:6px;quotes:"“" "”"}
.quote{border-left:0;padding:16px 0 4px;margin-top:16px;border-top:1px solid var(--rule)}
.quote blockquote{font:500 italic 22px/1.3 var(--disp);text-wrap:pretty}
.quote blockquote::before{content:"“";font-size:44px;line-height:0;vertical-align:-.35em;margin-right:3px;color:var(--acc)}
.nums{display:grid;gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:12px;overflow:hidden;margin-top:16px}
.nums div{background:var(--paper);padding:9px 12px;display:flex;justify-content:space-between;gap:12px;font-size:15px;line-height:1.25}
.nums div b{font-weight:600;text-align:right}
.src{border-top:1px solid var(--rule);padding:13px 0;cursor:pointer}
.src:last-child{border-bottom:1px solid var(--rule)}
.src .tt{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.src h3{font-size:18px}
.toast{position:absolute;left:16px;right:16px;top:56px;z-index:70;background:var(--ink);color:var(--paper);border-radius:14px;padding:12px 14px;font-size:15px;animation:up .3s;pointer-events:none;display:flex;gap:12px;align-items:center}
.toast .bi{width:38px;height:38px;border-radius:50%;background:var(--acc);color:var(--paper);display:grid;place-items:center;font-size:19px;flex:none;animation:pop .5s}
.row{display:flex;gap:12px;align-items:center}
.era-row{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--rule)}
.era-row .n{font:800 28px/1 var(--disp);color:var(--ink3)}
.bar{height:6px;background:var(--paper3);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.cmp div{border:1px solid var(--rule);border-radius:10px;padding:8px 10px;font-size:14.5px;line-height:1.25}
.cmp div.m{background:var(--ink);color:var(--paper)}
.cmp .mono{display:block;margin-bottom:3px;font-size:9.5px;opacity:.75}
.vrow{display:grid;grid-template-columns:86px 1fr 26px;gap:10px;align-items:center;padding:5px 0;font-size:15px}
.vrow .bar{height:8px}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bdg{border:1px solid var(--rule);border-radius:12px;padding:10px 6px;text-align:center;font-size:13px;line-height:1.2}
.bdg .bi{width:36px;height:36px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:var(--acc);color:var(--paper)}
.bdg.off{opacity:.38}.bdg.off .bi{background:var(--paper3);color:var(--ink3)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fcard{border:1px solid var(--rule);border-radius:14px;padding:12px;text-align:left;background:var(--paper2)}

 .tabs{height:calc(64px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}.pane{bottom:calc(64px + env(safe-area-inset-bottom))}}

<script>
const {P,F,ERAS,EV,SRC,FIG,QUIZ,BADGES,VAL}=DD;
const Y0=1858,Y1=2026,KEY='dudo-v2';
const def={step:'splash',name:'',year:1858,picks:{},seen:[],srcSeen:[],pvSeen:[],figSeen:[],quiz:{},badges:[],filt:'Tất cả',sound:true,haptic:true,narr:true,rate:.95,zoomed:false,mapTapped:false,shared:false,ended:false,pal:'flag',grain:true,modern:false,grat:true,mstyle:'co',theme:'night'};
let S=Object.assign({},def,JSON.parse(localStorage.getItem(KEY)||'{}'));
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const $=s=>document.querySelector(s), app=$('#app'), layer=$('#layer');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let focusEv=null, gate=null, playT=null;

/* sound & haptics */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type,v,delay){const a=ac();if(!a||!S.sound)return;const t=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v||.2,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05);}
const SND={gong(){tone(98,3.4,'sine',.32);tone(147,2.6,'sine',.12,.01);tone(262,1.4,'triangle',.05,.02);},chime(){tone(880,.6,'triangle',.11);tone(1318,.9,'sine',.08,.09);},ok(){tone(660,.3,'triangle',.12);tone(990,.45,'triangle',.1,.1);},no(){tone(150,.4,'sawtooth',.05);},tick(){tone(1500,.035,'square',.025);}};
function buzz(p){if(S.haptic&&navigator.vibrate){try{navigator.vibrate(p);}catch(e){}}}
let lastTick=0;
/* narration */
let VOICE=null,warnedVoice=false;
const hasTTS='speechSynthesis' in window;
function pickVoice(){if(!hasTTS)return;const vs=speechSynthesis.getVoices();VOICE=vs.find(v=>/^vi/i.test(v.lang)&&/google|linh|an|hoaimy|namminh/i.test(v.name))||vs.find(v=>/^vi/i.test(v.lang))||null;}
if(hasTTS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function hush(){if(hasTTS)speechSynthesis.cancel();document.querySelectorAll('.nbtn').forEach(b=>b.textContent='▶ Nghe');}
function speak(text,onend){
 const done=()=>{onend&&onend();onend=null;};
 if(!S.narr||!hasTTS){done();return false;}
 speechSynthesis.cancel();
 if(!VOICE){pickVoice();if(!VOICE){if(!warnedVoice){warnedVoice=true;toast('Máy này chưa có giọng đọc tiếng Việt. Hãy cài giọng "Tiếng Việt" trong cài đặt hệ điều hành.');}done();return false;}}
 const u=new SpeechSynthesisUtterance(text);u.voice=VOICE;u.lang=VOICE.lang;u.rate=S.rate||.95;u.pitch=.9;u.volume=1;
 const guard=setTimeout(done,Math.max(6000,text.length*120));
 u.onend=u.onerror=()=>{clearTimeout(guard);done();};
 speechSynthesis.speak(u);return true;}
const evSpeech=v=>(v.diary?`Nhật ký dòng họ, năm ${v.y}. `:`Năm ${v.y}. `)+v.t+'. '+v.s;

/* palettes */
const PAL={
 flag:{dainam:'#d3a338',phap:'#3f5b8c',bh1:'#8496b6',bh2:'#3f5b8c',red:'#a8322b',yel:'#ddb03a',blue:'#2f5fa0',jp:'#b3322a'},
 sepia:{dainam:'#c7a46a',phap:'#6e5a43',bh1:'#a8916f',bh2:'#6e5a43',red:'#4f3a27',yel:'#d9bf8c',blue:'#8b7457',jp:'#4f3a27'}};
const NIGHT_SEPIA={dainam:'#e2c48a',phap:'#a88d68',bh1:'#cdb48a',bh2:'#a88d68',red:'#d8b47a',yel:'#efdcae',blue:'#9a8466',jp:'#d8b47a'};
const TH={archive:{land:'#e3d3b0',sea:'#c9d2c4'},night:{land:'#2b251d',sea:'#0f1619'},poster:{land:'#f2e7cd',sea:'#dcc99c'}};
function pal(){return S.theme==='night'&&S.pal==='sepia'?Object.assign({},PAL.sepia,NIGHT_SEPIA):PAL[S.pal];}
const TV={'#2e2216':'var(--ink)','#efe5cf':'var(--paper)','#5f4c36':'var(--ink2)','#8a7558':'var(--ink3)','#4e5f5a':'var(--rip)','#a8322b':'var(--red)'};
function themify(n){if(!n)return;n.querySelectorAll('*').forEach(el=>['fill','stroke','stop-color'].forEach(a=>{const v=el.getAttribute(a);if(v&&TV[v])el.style.setProperty(a,TV[v]);}));}
function fill(k){const c=pal();return {dainam:c.dainam,phap:c.phap,phap_bh:'url(#p-bh)',vndcch:c.red,chxhcn:c.red,vnch:'url(#p-vnch)',cmlt:'url(#p-cmlt)',tc:'url(#p-tc)',dnph:'url(#p-dnph)',jp:c.jp}[k];}
function flag(k){const c=pal();
 const m={dainam:`background:${c.dainam}`,phap:`background:linear-gradient(90deg,#2f4f8f 33%,#f3ecdc 33% 66%,#b23a32 66%)`,phap_bh:`background:repeating-linear-gradient(45deg,${c.bh1} 0 3px,${c.bh2} 3px 5px)`,
 vndcch:`background:${c.red}`,chxhcn:`background:${c.red}`,vnch:`background:linear-gradient(${c.yel} 0 34%,${c.red} 34% 43%,${c.yel} 43% 46%,${c.red} 46% 55%,${c.yel} 55% 58%,${c.red} 58% 67%,${c.yel} 67%)`,
 cmlt:`background:linear-gradient(${c.red} 50%,${c.blue} 50%)`,tc:`background:repeating-linear-gradient(45deg,${c.red} 0 3px,${c.phap} 3px 6px)`,dnph:`background:repeating-linear-gradient(45deg,${c.dainam} 0 3px,${c.phap} 3px 6px)`,jp:`background:radial-gradient(circle,${c.jp} 0 28%,#f3ecdc 32%)`};
 const star=S.pal==='flag'&&['vndcch','chxhcn','cmlt'].includes(k)?'<b>★</b>':'';
 return `<i class="flag" style="${m[k]}">${star}</i>`;}

/* game state helpers */
const eraOf=y=>[...ERAS].reverse().find(e=>y>=e.from)||ERAS[0];
const optOf=e=>e.opts.find(o=>o.id===S.picks[e.id]);
const curPick=y=>optOf(eraOf(y));
const picked=()=>ERAS.map(optOf).filter(Boolean);
function values(){const v={doc:0,song:0,tudo:0,dk:0};picked().forEach(o=>Object.entries(o.fx||{}).forEach(([k,n])=>v[k]+=n));return v;}
function allEv(){const d=[];picked().forEach(o=>d.push(...o.diary));return EV.concat(d).sort((a,b)=>a.y-b.y||(a.diary?1:0)-(b.diary?1:0));}
function visEv(){const f=S.filt;return allEv().filter(v=>f==='Tất cả'||v.k===f);}
function figsMet(){return new Set(Object.keys(FIG).filter(figOpen));}
function initials(n){const w=n.split(' ');return (w.length>1?w[w.length-2][0]+w[w.length-1][0]:w[0].slice(0,2)).toUpperCase();}
const FIGERA={ntp:'e1',td:'e1',ntt:'e1',ptg:'e1',hn:'e2',pdp:'e2',hht:'e2',pbc:'e2',pct:'e2',hcm:'e3',nth:'e3',pq:'e3',vng:'e4',bd:'e4',ttk:'e4',ndd:'e5',dvm:'e5',nvt:'e5',tqd:'e5',ld:'e6',nvl:'e6',pd:'e6'};
const figOpen=id=>!!S.picks[FIGERA[id]];
const FIGIMG={};let figImgP=null;
const av=(id,sz,lock)=>`<span class="av${lock?' lock':''}" data-fig="${id}"${sz?` style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.36)}px"`:''}>${FIGIMG[id]?`<img src="${FIGIMG[id]}" alt="">`:initials(FIG[id][0])}</span>`;
function setFigImg(id,url){return new Promise(res=>{const im=new Image();im.onload=()=>{if(im.naturalWidth<40){res(false);return;}FIGIMG[id]=url;document.querySelectorAll(`.av[data-fig="${id}"]`).forEach(e=>e.innerHTML=`<img src="${url}" alt="">`);const sl=document.getElementById('fg-'+id);if(sl&&!sl.getAttribute('src'))sl.setAttribute('src',url);res(true);};im.onerror=()=>res(false);im.src=url;});}
const getJSON=async u=>{const res=await fetch(u);if(!res.ok||!/json/.test(res.headers.get('content-type')||''))throw new Error('rate');return res.json();};
const FIGFB={nvl:'https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent('Tám Lê Thanh và Nguyễn Văn Linh (cropped) (2).jpg')+'?width=320'};
async function wpThumbs(host,ids){const r=await getJSON('https://'+host+'/w/api.php?format=json&origin=*&action=query&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=320&pilimit=50&titles='+encodeURIComponent(ids.map(k=>FIG[k][0]).join('|')));
 const back={};(r.query.normalized||[]).forEach(n=>back[n.to]=n.from);(r.query.redirects||[]).forEach(n=>back[n.to]=back[n.from]||n.from);
 const out={};Object.values(r.query.pages||{}).forEach(p=>{const name=back[p.title]||p.title;const id=ids.find(k=>FIG[k][0]===name);if(id&&p.thumbnail)out[id]=p.thumbnail.source;});return out;}
async function commonsThumb(name){const r=await getJSON('https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=6&gsrsearch='+encodeURIComponent(name+' filetype:bitmap')+'&prop=imageinfo&iiprop=url|mime&iiurlwidth=320');
 const ps=Object.values((r.query&&r.query.pages)||{}).sort((a,b)=>a.index-b.index);const p=ps.find(p=>p.imageinfo&&/jpeg|png/.test(p.imageinfo[0].mime)&&!/map|bản đồ|flag|signature|chữ ký/i.test(p.title));return p?p.imageinfo[0].thumburl:null;}
function loadFigImgs(){if(figImgP)return figImgP;
 figImgP=(async()=>{const ids=Object.keys(FIG);let miss=ids;
  for(const host of ['vi.wikipedia.org','en.wikipedia.org']){try{const t=await wpThumbs(host,miss);const ok=await Promise.all(miss.map(id=>t[id]?setFigImg(id,t[id]):false));miss=miss.filter((id,i)=>!ok[i]);}catch(e){}if(!miss.length)return;}
  for(const id of miss){let ok=false;if(FIGFB[id])ok=await setFigImg(id,FIGFB[id]);if(!ok){try{const u=await commonsThumb(FIG[id][0]);if(u)await setFigImg(id,u);}catch(e){}}}
 })();
 return figImgP;}
const fxChips=fx=>Object.entries(fx||{}).map(([k,n])=>`<span class="fx">+${n} ${VAL.find(v=>v[0]===k)[1]}</span>`).join('');
function archetype(){
 const c={vutrang:0,caicach:0,thuongthuyet:0};picked().forEach(o=>c[o.tag]++);
 const top=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];if(!top[1])return null;
 return {vutrang:['Người cầm súng','Bạn tin rằng độc lập phải giành bằng đấu tranh trực diện.'],caicach:['Nhà canh tân','Bạn tin vào giáo dục, cải cách và thay đổi từ bên trong.'],thuongthuyet:['Người hoà giải','Bạn chọn thương thuyết, nhượng bộ và giữ gìn sinh mạng.']}[top[0]];}
function matchStats(){let m=0,t=0,ag=0;ERAS.forEach(e=>{if(!e.prev)return;t++;const o=S.picks[e.id];if(!o)return;if(o===e.prev)m++;else ag++;});return {m,t,ag};}
function quizCorrect(){return Object.values(S.quiz).flat().filter(Boolean).length;}

/* badges */
function badgeState(){const ms=matchStats(),tags=new Set(picked().map(o=>o.tag));

  <div><div class="mono muted">${f[1]}</div><h2 style="margin-top:4px">${f[0]}</h2><div class="muted" style="font-style:italic">${f[2]}</div></div></div>
  <p style="margin-top:16px">${f[3]}</p>
  ${chose.length?`<div class="rule"></div><div class="mono muted">Đồng hành khi bạn chọn</div>${chose.map(([e,o])=>`<div style="font-size:16px;margin-top:6px"><span class="mono muted">${e.cy}</span> · ${o.label}${S.picks[e.id]===o.id?' <span class="mono" style="color:var(--acc)">· đã chọn</span>':''}</div>`).join('')}`:''}
  <p class="muted" style="font-size:13px;margin-top:16px">Tiểu sử tóm lược từ sử liệu công khai.</p>`,true);

let srcFilter='Tất cả', srcQ='';

 const kinds=['Tất cả',...new Set(SRC.map(s=>s.k))];
 const list=SRC.filter(s=>(srcFilter==='Tất cả'||s.k===srcFilter)&&(!srcQ||(s.t+s.by+s.at).toLowerCase().includes(srcQ.toLowerCase())));
 layer.innerHTML=`<div class="pane"><div class="mono muted">Kho sử liệu · ${SRC.length} hồ sơ</div><h1 style="margin:6px 0 4px">Sử liệu</h1>
  <p class="muted" style="font-size:16px">Văn bản gốc, hiệp ước, phông lưu trữ đã công bố, từ Huế, Hà Nội, Sài Gòn, Aix-en-Provence đến Washington.</p>
  <input class="f" id="sq" placeholder="Tìm văn bản, nơi lưu trữ…" value="${esc(srcQ)}" style="margin:14px 0 10px;height:44px;font-size:17px">
  <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:0 -20px;padding-left:20px">${kinds.map(k=>`<button class="chip${k===srcFilter?' on':''}" data-k="${k}">${k}</button>`).join('')}</div>
  <div style="margin-top:8px">${list.map(s=>`<div class="src" onclick="openSrc('${s.id}')"><div class="tt"><h3>${esc(s.t)}</h3><span class="mono muted" style="white-space:nowrap">${S.srcSeen.includes(s.id)?'✓ ':''}${s.k}</span></div><div class="muted" style="font-size:15px;margin-top:3px">${esc(s.y)} · ${esc(s.at)}</div></div>`).join('')||'<p class="muted" style="padding:20px 0">Không có kết quả.</p>'}</div></div>`;
 layer.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{srcFilter=b.dataset.k;paneSrc();});
 const q=$('#sq');q.oninput=()=>{srcQ=q.value;const p=q.selectionStart;paneSrc();const n=$('#sq');n.focus();n.setSelectionRange(p,p);};
}
function paneFig(){
 const met=figsMet(),ids=Object.keys(FIG);
 layer.innerHTML=`<div class="pane"><div class="mono muted">${met.size}/${ids.length} đã mở</div><h1 style="margin:6px 0 4px">Nhân vật</h1>
  <p class="muted" style="font-size:16px;margin-bottom:6px">Mỗi điểm rẽ dòng họ bạn đi qua sẽ mở khoá những nhân vật của thời đó.</p>
  ${ERAS.map(e=>{const fs=ids.filter(id=>FIGERA[id]===e.id),open=!!S.picks[e.id];return `<div class="row" style="justify-content:space-between;margin:22px 0 10px"><b style="font:700 18px var(--disp)">${e.n}. ${e.title}</b><span class="mono ${open?'':'muted'}" style="${open?'color:var(--acc)':''}">${open?'Đã mở':'Mở năm '+e.cy}</span></div>
   <div class="fgrid">${fs.map(id=>{const f=FIG[id];return `<button class="fcard${open?'':' off'}" onclick="openFig('${id}')">${av(id,0,!open)}<div class="nm" style="font:700 16.5px/1.15 var(--disp)">${f[0]}</div><div class="mono muted" style="margin-top:3px">${open?f[1]:'Chưa mở'}</div><div class="muted nm" style="font-size:13.5px;margin-top:4px;line-height:1.2">${f[2]}</div></button>`;}).join('')}</div>`;}).join('')}</div>`;
 loadFigImgs();
}
function compass(){const v=values();return VAL.map(([k,n])=>`<div class="vrow"><span>${n}</span><div class="bar"><i style="width:${Math.min(100,v[k]/18*100)}%"></i></div><b style="font:700 16px var(--disp);text-align:right">${v[k]}</b></div>`).join('');}
function paneMe(){
 const done=ERAS.filter(e=>S.picks[e.id]).length, a=archetype(), met=figsMet();
 layer.innerHTML=`<div class="pane"><div class="mono muted">Hồ sơ dòng họ</div><h1 style="margin:6px 0 2px">${esc(S.name||'Họ Lê')}</h1>
  <p class="muted" style="font-style:italic">${a?a[0]+' · '+a[1]:'Chưa có lựa chọn nào.'}</p>
  <div class="cmp" style="grid-template-columns:repeat(4,1fr);margin-top:16px">
   <div><span class="mono">Thế hệ</span><b style="font:700 22px var(--disp)">${done}/6</b></div>
   <div><span class="mono">Sự kiện</span><b style="font:700 22px var(--disp)">${S.seen.length}</b></div>
   <div><span class="mono">Sử liệu</span><b style="font:700 22px var(--disp)">${S.srcSeen.length}</b></div>
   <div><span class="mono">Đố đúng</span><b style="font:700 22px var(--disp)">${quizCorrect()}/12</b></div></div>
  <div class="bar" style="margin:14px 0 4px"><i style="width:${pct(S.year)}%"></i></div><div class="mono muted">Đã đi tới năm ${S.year}</div>
  <h3 style="margin:22px 0 6px">La bàn giá trị</h3>${compass()}
  <p class="muted" style="font-size:13px;margin-top:4px">Cộng dồn từ điều mỗi lực lượng tự tuyên bố theo đuổi.</p>
  <h3 style="margin:22px 0 10px">Huy hiệu · ${S.badges.length}/${BADGES.length}</h3>
  <div class="bgrid">${BADGES.map(([id,ic,n,d])=>`<div class="bdg${S.badges.includes(id)?'':' off'}"><div class="bi">${ic}</div><b>${n}</b><div class="muted" style="font-size:11.5px;margin-top:2px">${d}</div></div>`).join('')}</div>
  <h3 style="margin:22px 0 4px">Sáu thế hệ</h3>
  ${ERAS.map(e=>{const o=optOf(e);return `<div class="era-row"><div class="n">${e.n}</div><div><div class="row" style="justify-content:space-between"><b style="font:700 17px var(--disp)">${e.title}</b><span class="mono muted">${e.cy}</span></div>
   <div style="font-size:16px;margin-top:2px;${o?'':'color:var(--ink3)'}">${o?'Chọn <b>'+o.label+'</b> · đồng hành: <i>'+FIG[o.guide][0]+'</i>':'Chưa tới'}</div></div></div>`;}).join('')}
  <h3 style="margin:22px 0 6px">Cài đặt</h3>
  <button class="row" style="width:100%;justify-content:space-between;padding:8px 0" onclick="S.sound=!S.sound;save();paneMe();if(S.sound)SND.chime()"><span>Âm thanh</span><span class="sw${S.sound?' on':''}"></span></button>
  <button class="row" style="width:100%;justify-content:space-between;padding:8px 0" onclick="S.narr=!S.narr;save();paneMe();if(S.narr)speak('Giọng đọc đã bật.')"><span>Giọng đọc${hasTTS&&!VOICE?' <span class="muted" style="font-size:13px">· chưa có giọng tiếng Việt</span>':''}</span><span class="sw${S.narr?' on':''}"></span></button>
  <div class="row" style="justify-content:space-between;padding:6px 0"><span class="muted">Tốc độ đọc</span><div class="seg" style="width:190px">${[[.8,'Chậm'],[.95,'Vừa'],[1.15,'Nhanh']].map(([r,l])=>`<button class="${S.rate===r?'on':''}" style="height:30px;font-size:14px" onclick="S.rate=${r};save();paneMe();speak('Tốc độ ${l.toLowerCase()}.')">${l}</button>`).join('')}</div></div>
  <button class="row" style="width:100%;justify-content:space-between;padding:8px 0" onclick="S.haptic=!S.haptic;save();paneMe();buzz(20)"><span>Rung</span><span class="sw${S.haptic?' on':''}"></span></button>
  <div style="height:18px"></div>
  ${done?'<button class="btn" onclick="openShare()">Tạo thẻ chia sẻ</button><div style="height:10px"></div>':''}
  ${done===6?'<button class="btn ghost" onclick="goEnd()">Xem kết luận</button><div style="height:10px"></div>':''}
  <button class="lnk" onclick="resetAll()">Chơi lại từ đầu</button></div>`;
}
function goEnd(){if(!S.quiz.e6)openQuiz('e6',openEnd);else openEnd();}
function openEnd(){
 stopPlay(); if(!S.ended){S.ended=true;save();}
 const a=archetype(), ms=matchStats();
 const rows=ERAS.map(e=>{const o=optOf(e);const pv=e.opts.find(x=>x.id===e.prev);
  return `<div style="padding:14px 0;border-top:1px solid var(--rule)"><div class="row" style="justify-content:space-between"><b style="font:700 18px var(--disp)">${e.n}. ${e.title}</b><span class="mono muted">${e.cy}</span></div>
   <div class="cmp"><div class="m"><span class="mono">Bạn chọn</span>${o?o.label:'—'}</div><div><span class="mono">Hướng chiếm ưu thế</span>${pv?pv.label:'Không hướng nào'}</div></div>
   <p class="muted" style="font-size:15.5px;line-height:1.3;margin-top:8px">${e.hist}</p></div>`;}).join('');
 layer.innerHTML=`<div class="ov" style="padding:54px 20px 44px">
  <div class="row" style="justify-content:space-between"><button class="back" onclick="clearLayer();renderMap()" aria-label="Đóng">‹</button><span class="mono muted">Kết luận · 1858 – 2026</span></div>
  <div style="text-align:center;margin:24px 0 6px"><span class="stamp">Hồ sơ đã khép</span></div>
  <h1 style="text-align:center;font-size:38px;margin-top:14px">Mọi con đường đều dẫn về hôm nay</h1>
  <p class="muted" style="text-align:center;margin-top:10px">Dù dòng họ bạn chọn gì, bản đồ năm 2026 vẫn là một: một Việt Nam thống nhất từ Lũng Cú đến Cà Mau, cùng các quần đảo ngoài Biển Đông.</p>
  <div class="dbl" style="margin-top:20px"></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
   <div class="pv" style="text-align:center"><div class="mono muted">Trùng hướng chiếm ưu thế</div><div style="font:800 40px/1.1 var(--disp);color:var(--acc)">${ms.m}/${ms.t}</div></div>
   <div class="pv" style="text-align:center;margin-top:0"><div class="mono muted">Dòng họ bạn là</div><div style="font:700 21px/1.15 var(--disp);margin-top:6px">${a?a[0]:'—'}</div></div></div>
  <h3 style="margin:22px 0 6px">La bàn giá trị</h3>${compass()}
  <h3 style="margin:22px 0 4px">Con đường của bạn và lịch sử</h3>${rows}
  <div class="pv mine" style="margin-top:14px"><div class="mono muted">Điều đọng lại</div><p style="margin-top:6px">Ở mỗi điểm rẽ, người Việt ở mọi phía đều tin mình đang làm điều đúng cho đất nước. Lịch sử ghi lại bên chiếm ưu thế, còn sử liệu giữ lại tiếng nói của tất cả.</p></div>
  <div style="height:18px"></div><button class="btn" onclick="openShare()">Tạo thẻ chia sẻ</button><div style="height:10px"></div>
  <button class="btn ghost" onclick="setTab('src')">Đọc sử liệu gốc</button>
  <button class="lnk" onclick="resetAll()">Chọn lại từ 1858</button></div>`;
 checkBadges();
}
async function makeCard(){
 try{await document.fonts.ready;}catch(e){}
 const cs=getComputedStyle(app),c=k=>cs.getPropertyValue(k).trim();
 const W=1080,HH=1350,cv=document.createElement('canvas');cv.width=W;cv.height=HH;const x=cv.getContext('2d');
 const disp=c('--disp'),mono=c('--mono'),serif=c('--serif'),ink=c('--ink'),ink2=c('--ink2'),acc=c('--acc'),paper=c('--paper'),paper3=c('--paper3');
 x.fillStyle=paper;x.fillRect(0,0,W,HH);
 x.strokeStyle=ink;x.lineWidth=3;x.strokeRect(40,40,W-80,HH-80);x.lineWidth=1;x.strokeRect(54,54,W-108,HH-108);
 x.fillStyle=ink2;x.font=`500 24px ${mono}`;x.fillText('DƯ ĐỒ · HỒ SƠ DÒNG HỌ · 1858 – 2026',100,135);
 x.fillStyle=acc;x.font=`900 120px ${disp}`;x.fillText((S.name||'Họ Lê').slice(0,16),96,260);
 const a=archetype();x.fillStyle=ink;x.font=`italic 500 44px ${serif}`;x.fillText(a?a[0]:'Đang trên đường',100,330);
 let y=410;x.fillStyle=ink;x.fillRect(100,y-30,W-200,2);
 ERAS.forEach(e=>{const o=optOf(e);x.fillStyle=acc;x.font=`500 26px ${mono}`;x.fillText(String(e.cy),100,y+22);x.fillStyle=ink2;x.font=`400 30px ${serif}`;x.fillText(e.title,220,y+22);
  x.fillStyle=ink;x.font=`700 34px ${disp}`;x.textAlign='right';x.fillText(o?o.label:'—',W-100,y+22);x.textAlign='left';y+=74;});
 y+=30;x.fillStyle=ink;x.fillRect(100,y-30,W-200,2);
 const v=values();VAL.forEach(([k,n])=>{x.fillStyle=ink2;x.font=`400 30px ${serif}`;x.fillText(n,100,y+10);x.fillStyle=paper3;x.fillRect(300,y-8,560,16);x.fillStyle=acc;x.fillRect(300,y-8,560*Math.min(1,v[k]/18),16);x.fillStyle=ink;x.font=`700 34px ${disp}`;x.textAlign='right';x.fillText(String(v[k]),W-100,y+12);x.textAlign='left';y+=58;});
 const ms=matchStats();y+=40;x.fillStyle=ink;x.font=`700 40px ${disp}`;x.fillText(`Trùng hướng chiếm ưu thế ${ms.m}/${ms.t}  ·  ${S.badges.length} huy hiệu`,100,y);
 x.fillStyle=ink2;x.font=`italic 400 30px ${serif}`;x.fillText('Một trò chơi lịch sử. Không có câu trả lời đúng.',100,HH-110);
 return cv.toDataURL('image/png');
}
async function openShare(){
 const url=await makeCard();if(!S.shared){S.shared=true;save();}
 const d=sheet(`<div class="mono muted">Thẻ chia sẻ</div><h2 style="margin:6px 0 12px">Con đường của dòng họ bạn</h2>
  <img src="${url}" alt="Thẻ kết quả" style="width:100%;border-radius:10px;border:1px solid var(--rule);display:block">
  <div style="height:14px"></div><a class="btn" href="${url}" download="du-do-${(S.name||'ho-le').replace(/\s+/g,'-').toLowerCase()}.png">Tải ảnh</a>
  <div style="height:10px"></div><button class="btn ghost" id="nshare">Chia sẻ…</button>`,true);
 d.querySelector('#nshare').onclick=async()=>{try{const b=await (await fetch(url)).blob();const f=new File([b],'du-do.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:'Dư Đồ'});else toast('Trình duyệt này chưa hỗ trợ chia sẻ trực tiếp. Hãy tải ảnh.');}catch(e){}};
 checkBadges();
}
function resetAll(){S=Object.assign({},def,{pal:S.pal,theme:S.theme,mstyle:S.mstyle,grain:S.grain,modern:S.modern,grat:S.grat,sound:S.sound,haptic:S.haptic});save();focusEv=null;gate=null;tkKey='';setTab('map');S.year=1858;renderMap();splash();}
function setTab(t){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));if(t==='map'){clearLayer();renderMap();}else if(t==='src')paneSrc();else if(t==='fig')paneFig();else paneMe();}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{ac();setTab(b.dataset.t);});

/* tweaks */
function syncTw(){app.dataset.theme=S.theme;document.querySelectorAll('#twTh button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.theme));document.querySelectorAll('#twPal button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.pal));document.querySelectorAll('#twSty button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.mstyle));
 $('#twGrain').checked=S.grain;$('#twModern').checked=S.modern;$('#twGrat').checked=S.grat;$('#twSound').checked=S.sound;$('#twNarr').checked=S.narr;app.classList.toggle('grain',S.grain);}
const twSeg=(sel,key)=>document.querySelectorAll(sel+' button').forEach(b=>b.onclick=()=>{S[key]=b.dataset.v;save();syncTw();buildDefs();renderMap();});
twSeg('#twTh','theme');twSeg('#twPal','pal');twSeg('#twSty','mstyle');
[['#twGrain','grain'],['#twModern','modern'],['#twGrat','grat'],['#twSound','sound'],['#twNarr','narr']].forEach(([s,k])=>$(s).onchange=e=>{S[k]=e.target.checked;save();syncTw();renderMap();});
document.querySelectorAll('.tw .jump button').forEach(b=>b.onclick=()=>{const j=b.dataset.j;
 const fillN=n=>ERAS.slice(0,n).forEach(e=>{if(!S.picks[e.id])S.picks[e.id]=e.opts[0].id;});
 if(!S.name)S.name='Họ Lê';tkKey='';
 if(j==='intro'){setTab('map');intro();return;}
 if(j==='reset'){resetAll();return;}
 S.step='play';
 if(j==='1954'){setTab('map');ERAS.forEach((e,i)=>{if(i>=4)delete S.picks[e.id];});fillN(4);delete S.quiz.e4;S.year=1953;save();setYear(1954,true);}
 else if(j==='quiz'){setTab('map');openQuiz('e4',()=>{});}
 else if(j==='event'){setTab('map');fillN(5);S.year=1954;save();setFocus();focusEv=EV.find(v=>v.id==='dbp');renderMap();openEvent('dbp');}
 else if(j==='fig'){fillN(5);save();setTab('fig');}
 else if(j==='me'){fillN(5);save();setTab('me');}
 else if(j==='end'){setTab('map');fillN(6);S.quiz.e6=S.quiz.e6||[true,true];S.year=Y1;setFocus();save();renderMap();openEnd();}
 else if(j==='share'){setTab('map');fillN(6);save();renderMap();openShare();}
});
function fit(){if(innerWidth<=520){$('#pw').style.transform='';$('#pw').style.margin='';return;}const s=Math.min(1,(innerHeight-24)/868,(innerWidth-(innerWidth>760?330:0))/414);$('#pw').style.transform=`scale(${s})`;$('#pw').style.margin=`${-(868*(1-s))/2}px ${-(414*(1-s))/2}px`;}
addEventListener('resize',fit);fit();
syncTw(); setFocus(); initMap(); renderMap(); loadFigImgs();
if(S.step==='splash')splash(); else if(S.step==='intro')intro(); else {const p=ERAS.find(e=>!S.picks[e.id]&&e.cy<=S.year);if(p)setYear(S.year,true);}
</script>
